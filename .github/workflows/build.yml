name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tiffin Register" com.tiffin.register --web-dir www
          npx cap add android
          npx cap sync android
      - name: Make 🍱 icon
        continue-on-error: true
        run: |
          sudo apt-get install -y fonts-noto-color-emoji python3-pil
          python3 - <<'EOF'
          import glob, os
          from PIL import Image, ImageDraw, ImageFont
          f = ImageFont.truetype('/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf', 109)
          im = Image.new('RGBA', (160, 160), (255, 224, 178, 255))
          ImageDraw.Draw(im).text((22, 14), '🍱', font=f, embedded_color=True)
          im = im.resize((192, 192))
          for d in glob.glob('android/app/src/main/res/mipmap-*'):
              if d.endswith('anydpi-v26'):
                  for x in glob.glob(d + '/*'): os.remove(x)
                  os.rmdir(d)
              else:
                  for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                      im.save(d + '/' + n + '.png')
          EOF
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TiffinRegister.apk
          gh release create "v${{ github.run_number }}" TiffinRegister.apk --title "Tiffin Register v${{ github.run_number }}" --notes "Download TiffinRegister.apk and install"
        env:
          GH_TOKEN: ${{ github.token }}
